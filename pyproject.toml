[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimusic"
version = "0.1.0"
description = "Symbolic music generation with GTTM-inspired energies and Schrodinger bridge inference."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "mido",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["aimusic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

