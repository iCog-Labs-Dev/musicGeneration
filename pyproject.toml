[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimusic"
version = "0.1.0"
description = "Symbolic music generation with GTTM-inspired energies and Schrodinger bridge inference."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "mido",
]

[project.optional-dependencies]
ml = [
  "jax[cuda12]",
  "flax",
  "optax",
  "orbax-checkpoint",
  "tqdm",
]
clearml = [
  "clearml",
]
audio = [
  # M1 CI-safe deterministic spine (no fluidsynth / torch).
  "PyYAML",
  "pydantic>=2.5",
  "pretty_midi>=0.2.10",
  "soundfile>=0.12.0",
  "numpy",
]
audio-bridge = [
  "aimusic[audio]",
  # Pin public main tip with M1–M3 spine; retag v0.1.0 later when local m2a commits push.
  "midi2audio-generative @ git+https://github.com/arsenylosev/midi2audio_generative.git@46b3dfe",
]
dev = [
  "pytest",
  "flake8",
  "mypy",
  "hypothesis>=6.90.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["aimusic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "ml: tests requiring optional JAX/ML dependencies (pip install -e \".[ml]\")",
]

